services:
  nginx:
    restart: unless-stopped
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/config/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php84

  php84:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    image: colma-php:8.4-production
    volumes:
      - ./:/var/www/html
      - ./docker/config/php/production.ini:/usr/local/etc/php/conf.d/zz-colma.ini:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - 9000
    depends_on:
      - mysql

  node:
    image: node:24.22.2-bookworm-slim
    working_dir: /var/www/html
    profiles:
      - tools
    volumes:
      - ./:/var/www/html

  mysql:
    restart: unless-stopped
    image: mysql:8.0.26
    command: --default-authentication-plugin=mysql_native_password --sql-mode=""
    volumes:
      - ./db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - ${MYSQL_HOST_PORT}:3306
