services:
    nginx:
        restart: unless-stopped
        image: nginx:stable-alpine
        volumes:
            - ./:/var/www/html:delegated
            - ./docker/config/nginx/development.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php84
        ports:
            - ${HTTP_HOST_PORT:-80}:80

    php84:
        restart: unless-stopped
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: development
        image: colma-php:8.4-development
        command: sh -c "chmod -R a+rwX storage bootstrap/cache && exec php-fpm"
        volumes:
            - ./:/var/www/html:delegated
            - ./docker/config/php/development.ini:/usr/local/etc/php/conf.d/zz-colma.ini:ro
        extra_hosts:
            - "host.docker.internal:host-gateway"
        expose:
            - 9000
        depends_on:
            - mysql

    node:
        restart: unless-stopped
        image: node:22-bookworm-slim
        working_dir: /var/www/html
        command:
            - sh
            - -c
            - |
                cleanup() { rm -f public/hot; }
                trap 'kill -TERM $$child 2>/dev/null; wait $$child; cleanup; exit 0' TERM INT
                npm run dev -- --host 0.0.0.0 &
                child=$$!
                wait $$child
                status=$$?
                cleanup
                exit $$status
        volumes:
            - ./:/var/www/html:delegated
        ports:
            - ${VITE_PORT:-5173}:5173
        depends_on:
            - php84

    mysql:
        restart: unless-stopped
        image: mysql:8.0.26
        command: --default-authentication-plugin=mysql_native_password --sql-mode=""
        volumes:
            - ./db:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        ports:
            - ${MYSQL_HOST_PORT}:3306
